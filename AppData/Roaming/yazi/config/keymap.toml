[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin yamb -- save"
desc = "Add bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "g" ]
run = "plugin yamb -- jump_by_key"
desc = "Jump bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "G" ]
run = "plugin yamb -- jump_by_fzf"
desc = "Jump bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin yamb -- delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin yamb -- delete_by_fzf"
desc = "Delete bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "A" ]
run = "plugin yamb -- delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = [ "u", "r" ]
run = "plugin yamb -- rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "R" ]
run = "plugin yamb -- rename_by_fzf"
desc = "Rename bookmark by fzf"

[[mgr.prepend_keymap]]
on   = [ "e", "l" ]
run  = 'shell --block "lazygit"'
desc = "lazygit"

[[mgr.prepend_keymap]]
on   = [ "e", "s" ]
run  = 'shell --block "lazyssh"'
desc = "lazyssh"

[[mgr.prepend_keymap]]
on   = [ "e", "u" ]
run  = 'shell --block "pwsh -f moduleup.ps1"'
desc = "module up"

[[mgr.prepend_keymap]]
on   = [ "e", "a" ]
run  = 'shell --block "claude agents"'
desc = "agents"

[[mgr.prepend_keymap]]
on   = [ "e", "c" ]
run  = 'shell --block "claude"'
desc = "claude"

[[mgr.prepend_keymap]]
on   = [ "e", "p" ]
run  = 'shell --block "pi"'
desc = "pi"
