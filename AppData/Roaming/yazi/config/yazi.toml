
[mgr]
ratio = [2, 3, 4]
sort_dir_first = true
linemode = "size"
max_width = 3840
max_height = 2160


[opener]
play = [
    { run = 'mpv "%s"', orphan = true },
]
edit = [
    { run = '$EDITOR "$s"', desc = "Editor", block = true, for = "unix" },
    { run = "hx %s", desc = "Helix", block = true, for = "windows" },
    { run = 'zed %s', orphan = true, desc = "Zed" },
    { run = 'code %s', orphan = true, desc = "Code" },
    { run = 'code -w %s', block = true, desc = "Code (block)" },
]
open = [
    { run = 'xdg-open "$s1"', desc = "Open", for = "unix" },
    { run = 'start "" "%s1"', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
    { run = 'xdg-open "$d1"', desc = "Reveal", for = "linux" },
    { run = 'c:\windows\explorer.exe /select,"%s1"', orphan = true, desc = "Reveal", for = "windows" },
]
extract = [
    { run = 'ya pub extract --list "%s"', desc = "Extract here" },
]
[open]
rules = [
    # Folder
    { url = "*/", use = [
        "edit",
        "open",
        "reveal",
    ] },
    # Text
    { mime = "text/*", use = [
        "edit",
        "open",
        "reveal",
    ] },
    # Image
    { mime = "image/*", use = [
        "open",
        "reveal",
    ] },
    # Media
    { mime = "{audio,video}/*", use = [
        "play",
        "open",
        "reveal",
    ] },
    # Archive
    { mime = "application/{,g}zip", use = [
        "extract",
        "open",
        "reveal",
    ] },
    { mime = "application/{tar,bzip*,7z-compressed,xz,rar}", use = [
        "extract",
        "open",
        "reveal",
    ] },
    # JSON
    { mime = "application/{json,ndjson}", use = [
        "edit",
        "open",
        "reveal",
    ] },
    { mime = "*/javascript", use = [
        "edit",
        "open",
        "reveal",
    ] },
    # Empty file
    { mime = "inode/empty", use = [
        "edit",
        "open",
        "reveal",
    ] },
    # Fallback
    { url = "*", use = [
        "open",
        "edit",
        "reveal",
    ] },
]

[plugin]


spotters = [
    { url = "*/", run = "folder" },
    # Code
    { mime = "text/*", run = "code" },
    { mime = "*/{xml,javascript,wine-extension-ini}", run = "code" },
    # Image
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Video
    { mime = "video/*", run = "video" },
    # Fallback
    { url = "*", run = "file" },
]
preloaders = [
    # Image
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Video
    { mime = "video/*", run = "video" },
    # PDF
    { mime = "application/pdf", run = "pdf" },
    # Font
    { mime = "font/*", run = "font" },
    { mime = "application/vnd.ms-opentype", run = "font" },
]
previewers = [
    { url = "*/", run = "folder", sync = true },
    # Code
    { mime = "text/*", run = "code" },
    { mime = "*/{xml,javascript,wine-extension-ini}", run = "code" },
    # JSON
    { mime = "application/{json,ndjson}", run = "json" },
    # Image
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Video
    { mime = "video/*", run = "video" },
    # PDF
    { mime = "application/pdf", run = "pdf" },
    # Archive
    { mime = "application/{,g}zip", run = "archive" },
    { mime = "application/{tar,bzip*,7z-compressed,xz,rar,iso9660-image}", run = "archive" },
    # Font
    { mime = "font/*", run = "font" },
    { mime = "application/vnd.ms-opentype", run = "font" },
    # Empty file
    { mime = "inode/empty", run = "empty" },
    # Fallback
    { url = "*", run = "file" },
]
